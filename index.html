<title>Zero to Hero – Suivi de séance</title>
<style>
:root{--hd:#47788a;--bg:#efefef;--card:#fff;--ink:#1c2b31;--mute:#5d7f8c;--line:#c5d3d8;--ac:#47788a;--acs:#dbe6e9;--ok:#2e7d4f;--oks:#e0f0e6;--go:#a9791c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--hd:#3a6677;--bg:#171e21;--card:#222c30;--ink:#f1f1f1;--mute:#8fa8b1;--line:#3a5560;--ac:#6fa5b8;--acs:#28434d;--ok:#6cc095;--oks:#1b3a2a;--go:#d4a84a}}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;padding-bottom:140px}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--hd);z-index:5;padding:10px 12px 10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
h1{font-size:16px;margin:0 0 8px;letter-spacing:.02em;color:#fff;text-transform:uppercase}
.tabs{display:flex;gap:6px}
.tab{flex:1;padding:10px 0;border:1px solid rgba(255,255,255,.75);background:transparent;color:#fff;border-radius:6px;font:600 15px inherit;font-family:inherit}
.tab.on{background:#fff;color:#2f5a6a;border-color:#fff}
.tab{font-size:14px;padding:10px 2px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chg{background:transparent;border:1px solid rgba(255,255,255,.75);color:#fff;border-radius:6px;padding:6px 10px;font-family:inherit;font-size:13px;font-weight:600;margin-bottom:8px}
.chg[hidden],.tabs[hidden]{display:none}
.pc{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;color:var(--ink);font-family:inherit}
.pc h2{font-size:20px;margin:0 0 4px;color:var(--ac)}.pc span{display:block;font-size:15px}.pc small{display:block;margin-top:6px}.pc.last{border:2px solid var(--ac)}
.row.lg,.lab.lg{grid-template-columns:24px 1fr 1.8fr 1fr 46px}.row.lg input::placeholder{font-size:11px}
.cap{font-size:12px;color:var(--mute);margin:-2px 0 8px 30px}
.vid{color:var(--ac);font-weight:600;text-decoration:underline}
.card header .ico{width:46px;height:46px;flex:none;fill:none;stroke:var(--ac);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.ico circle{fill:var(--ac);stroke:none}.ico .eq{stroke-width:2;opacity:.55}.ico .pd{stroke-width:4;opacity:.35}
.ico .st{stroke-width:6;stroke-dasharray:2.4 1.4;stroke-linecap:butt;opacity:.45}
.mach{width:100%;margin:0 0 8px;padding:9px;border:1px dashed rgba(255,255,255,.85);background:transparent;color:#fff;border-radius:6px;font-family:inherit;font-size:14px;font-weight:600}
.mach[hidden]{display:none}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:20;padding:20px}
#dlg[hidden],.dbox [hidden]{display:none}
.dbox{background:var(--card);color:var(--ink);border-radius:14px;padding:18px;max-width:340px;width:100%}
.dbox p{margin:0 0 14px;font-size:16px}.dbox textarea{width:100%;margin-bottom:12px;font-size:12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px}
.dbt{display:flex;gap:8px}.dbt .btn{margin:0;flex:1}
main{padding:10px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.card header{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer}
.card header b{width:28px;height:28px;border-radius:50%;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-size:14px;flex:none}
.card header div{flex:1;min-width:0}
h2{font-size:16px;margin:0}
small{color:var(--mute);font-size:13px}
.cnt{font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.card.fin header b{background:var(--ok);color:var(--bg)}
.card.fin .cnt{color:var(--ok)}
.body{display:none;padding:0 12px 12px}
.card.open .body{display:block}
.note{font-size:13px;color:var(--mute);margin:0 0 8px}
.row,.lab{display:grid;grid-template-columns:24px 1fr 1fr 1fr 46px;gap:6px;align-items:center;margin-bottom:6px}
.lab{font-size:12px;color:var(--mute);text-align:center;margin-bottom:2px}
.row .n{text-align:center;color:var(--mute);font-weight:600}
input{width:100%;min-width:0;height:44px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:600 17px inherit;font-family:inherit;text-align:center;padding:0 4px}
input::placeholder{color:var(--mute);font-weight:400}
input:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.ck{height:44px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--mute);font-size:20px}
.row.done input{background:var(--oks)}
.row.done .ck{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.fin-btn,.btn{display:block;width:100%;padding:14px;border-radius:12px;border:0;background:var(--ac);color:var(--bg);font:700 16px inherit;font-family:inherit;margin-top:6px}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600}
#tb{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:#1c2b31;color:#f1f1f1;border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:8px;z-index:6;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#tb[hidden]{display:none}
#tb .okb{background:#d4a84a;border-color:#d4a84a;color:#1b1405;min-width:60px;height:44px;font-size:17px;font-weight:700}
#tb .mid{flex:1;min-width:0}
#tl{font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tt{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
#tt.go{color:#e0b95a}
#tb button{height:40px;min-width:46px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:transparent;color:inherit;font:600 14px inherit;font-family:inherit}
.hs{padding:12px}
.hs h2{display:flex;justify-content:space-between}
details{margin-top:6px}summary{color:var(--ac);font-size:14px;padding:4px 0}
.hl{font-size:14px;margin:4px 0}.hl span{color:var(--mute)}
.del{background:none;border:0;color:var(--mute);font-size:13px;text-decoration:underline;padding:6px 0}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
select{width:100%;height:44px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:16px;font-weight:600;padding:0 8px;margin:8px 0}
.seg{display:flex;gap:6px;margin-bottom:8px}.seg button{flex:1;padding:9px 0;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:14px;font-weight:600}.seg button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
svg{width:100%;height:auto;display:block}.ln{fill:none;stroke:var(--ac);stroke-width:2.5;stroke-linejoin:round}.pt{fill:var(--ac)}.gr{stroke:var(--line);stroke-width:1}.tx{fill:var(--mute);font-size:10px}
.hbar{display:flex;gap:8px;margin-bottom:10px}.hbar .btn{width:auto;flex:1;margin:0;padding:11px}.hbar .tr{background:#b3382c;color:#fff;border:0;flex:none;min-width:76px}.hbar .tr:disabled{opacity:.35}
.card.sel{border-color:var(--ac);background:var(--acs)}.hl2{display:flex;align-items:center}.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--mute);display:inline-grid;place-items:center;font-size:14px;margin-right:10px;flex:none}.sel .chk{background:var(--ac);border-color:var(--ac);color:var(--bg)}
</style>
</head>
<body>
<div class="top">
<div class="hrow"><h1 id="ttl">Zero to Hero</h1><button id="chg" class="chg" hidden>Programme</button></div>
<button id="mach" class="mach" hidden></button>
<div class="tabs" id="tabs" hidden></div>
</div>
<main id="main"></main>

 S.h.slice().reverse().forEach(s=>{const e=s.ex.find(x=>x.n===CE);if(!e)return;let y=0;
  e.sets.forEach(x=>{const w=parseFloat(x.w),r=parseFloat(x.r);if(isNaN(w))return;
   const v=CM==="w"?w:CM==="v"?w*(isNaN(r)?0:r):(isNaN(r)?w:w*(1+r/30));
   y=CM==="v"?y+v:Math.max(y,v)});
  if(y>0)P.push({t:s.date,y})});
 const r1=x=>Math.round(x*10)/10;
 if(P.length<2)return `<p class="note">${P.length?"Une seule séance enregistrée pour cet exercice : "+r1(P[0].y)+" kg. Il en faut deux pour tracer la courbe.":"Aucun poids saisi pour cet exercice."}</p>`;
 const W=320,H=170,L=40,B=24,T=10,R=10;
 let lo=Math.min(...P.map(p=>p.y)),hi=Math.max(...P.map(p=>p.y));
 if(hi===lo){hi+=1;lo-=1}
 const pad=(hi-lo)*.1;lo=Math.max(0,lo-pad);hi+=pad;
 const X=i=>L+(W-L-R)*(i/(P.length-1)),Y=y=>T+(H-T-B)*(1-(y-lo)/(hi-lo));
 const fd=t=>new Date(t).toLocaleDateString("fr-FR",{day:"numeric",month:"numeric"});
 let g="";for(let i=0;i<3;i++){const y=lo+(hi-lo)*i/2;g+=`<line class="gr" x1="${L}" x2="${W-R}" y1="${Y(y)}" y2="${Y(y)}"/><text class="tx" x="${L-4}" y="${Y(y)+3}" text-anchor="end">${Math.round(y)}</text>`}
 const a=P[0].y,z=P[P.length-1].y;
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe de progression">${g}<polyline class="ln" points="${P.map((p,i)=>X(i)+","+Y(p.y)).join(" ")}"/>${P.map((p,i)=>`<circle class="pt" cx="${X(i)}" cy="${Y(p.y)}" r="3.5"/>`).join("")}<text class="tx" x="${L}" y="${H-6}">${fd(P[0].t)}</text><text class="tx" x="${W-R}" y="${H-6}" text-anchor="end">${fd(P[P.length-1].t)}</text></svg><p class="note">Dernière valeur : ${r1(z)} kg (${z>=a?"+":""}${r1(z-a)} depuis la première séance)</p>`;
}
function renderH(m){
 if(!S.h.length){m.innerHTML=`<p class="empty">Aucune séance enregistrée. Termine une séance pour la retrouver ici.</p><button class="btn sec" id="imp">Importer une sauvegarde</button>`;return}
 const names=[...new Set(S.h.flatMap(s=>s.ex.map(e=>e.n)))];
 if(!names.includes(CE))CE=names[0];
 let h=`<section class="card hs"><h2><span>Progression</span></h2><select id="ce" aria-label="Exercice">${names.map(n=>`<option${n===CE?" selected":""}>${n}</option>`).join("")}</select><div class="seg"><button data-cm="w" class="${CM==="w"?"on":""}">Poids max</button><button data-cm="e" class="${CM==="e"?"on":""}">1RM estimé</button><button data-cm="v" class="${CM==="v"?"on":""}">Volume</button></div>${chart()}</section>`;
 h+=`<div class="hbar">${HS?`<button class="btn sec" id="hall">${SEL.size===S.h.length?"Tout désélectionner":"Tout sélectionner"}</button><button class="btn tr" id="htr" ${SEL.size?"":"disabled"} aria-label="Supprimer la sélection">🗑 ${SEL.size||""}</button><button class="btn sec" id="hcx">Annuler</button>`:`<button class="btn sec" id="hsel">Sélectionner</button>`}</div>`;
 h+=S.h.map((s,i)=>`<section class="card hs ${HS&&SEL.has(i)?"sel":""}" data-i="${i}"><h2><span class="hl2">${HS?`<span class="chk">${SEL.has(i)?"✓":""}</span>`:""}${PN[s.p||'min']} · ${TL[s.p||'min'][s.t]}</span><small>${new Date(s.date).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"})} · ${s.min} min</small></h2>
 ${HS?`<small>${s.ex.length} exercices</small>`:`<details><summary>Voir le détail</summary>${s.ex.map(e=>`<div class="hl"><b>${e.n}</b><br><span>${e.sets.map(x=>`${x.w||"–"} kg × ${x.r||"–"}${x.rest?" (repos "+x.rest+" s)":""}`).join("<br>")}</span></div>`).join("")}</details>`}</section>`).join("");
 m.innerHTML=h+`<button class="btn sec" id="exp">Copier toutes les données</button><button class="btn sec" id="imp" style="margin-top:8px">Importer une sauvegarde</button>`;
}
function beep(){try{if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=880;g.gain.value=.25;o.start();o.stop(actx.currentTime+.35)}catch(e){}}
function tick(){
 const d=S.d,t=d&&d.tm;if(!t||t.hide)return;
 const el=(Date.now()-t.st)/1000,rem=t.dur-el;
 if(rem>0){$("#tt").textContent=f(Math.ceil(rem));$("#tt").className=""}
 else{$("#tt").textContent="Go +"+f(-rem);$("#tt").className="go";if(!t.b){t.b=1;save();beep();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}}
}
function bar(){
 const d=S.d,t=d&&d.tm,el=$("#tb");
 if(!t||t.hide){el.hidden=true;return}
 const [ei,si]=t.k.split("-").map(Number),ex=PROG[d.t][ei];
 $("#tl").textContent="Repos · "+nm(d.t,ei)+" · série "+(si+1);
 el.hidden=false;tick();
}
setInterval(tick,250);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){tick();if(wl===null)lock()}});
async function lock(){try{if(navigator.wakeLock){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null})}}catch(e){}}

function check(k){
 const d=getD(V),[ei,si]=k.split("-").map(Number),ex=PROG[V][ei];
 const st=d.sets[k]||(d.sets[k]={});
 try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume()}catch(e){}
 lock();
 if(st.done){st.done=false;save();render();return}
 if(!st.w){const p=ph(V,ei,si);if(p)st.w=p}
 if(d.tm&&!d.tm.fin&&d.sets[d.tm.k]){d.sets[d.tm.k].rest=String(Math.round((Date.now()-d.tm.st)/1000))}
 st.done=true;
 d.tm={k,st:Date.now(),dur:ex.rest,b:0,hide:false};
 if(ex.reps.every((_,i)=>d.sets[ei+"-"+i]&&d.sets[ei+"-"+i].done))OP=ei+1<PROG[V].length?ei+1:ei;
 save();render();
}
function finish(){
 const d=S.d;if(!d)return;
 const ex=PROG[d.t].map((e,ei)=>({n:nm(d.t,ei),sets:e.reps.map((_,i)=>d.sets[ei+"-"+i]).filter(x=>x&&x.done).map(x=>({w:x.w||"",r:x.r||"",rest:x.rest||""}))})).filter(e=>e.sets.length);
 S.h.unshift({p:S.p,t:d.t,date:Date.now(),min:Math.max(1,Math.round((Date.now()-d.s)/60000)),ex});
 S.d=null;OP=0;save();V="H";render();scrollTo(0,0);
}
$("#main").addEventListener("click",e=>{
 const o=e.target.closest("[data-o]"),c=e.target.closest("[data-ck]"),x=e.target.closest("[data-del]");
 if(o){const i=+o.dataset.o;OP=OP===i?-1:i;render()}
 else if(c)check(c.dataset.ck);
 else if(e.target.closest("[data-cm]")){CM=e.target.closest("[data-cm]").dataset.cm;render()}
 else if(e.target.closest('[data-p]')){choose(e.target.closest('[data-p]').dataset.p)}
 else if(e.target.id==="hsel"){HS=true;SEL.clear();render()}
 else if(e.target.id==="hcx"){HS=false;SEL.clear();render()}
 else if(e.target.id==="hall"){if(SEL.size===S.h.length)SEL.clear();else S.h.forEach((_,i)=>SEL.add(i));render()}
 else if(e.target.closest("#htr")){const n=SEL.size;if(n)ask("Supprimer "+n+(n>1?" séances":" séance")+" ?",()=>{S.h=S.h.filter((_,i)=>!SEL.has(i));SEL.clear();HS=false;save();render()})}
 else if(HS&&e.target.closest("[data-i]")){const i=+e.target.closest("[data-i]").dataset.i;if(SEL.has(i))SEL.delete(i);else SEL.add(i);render()}
 else if(x){if(confirm("Supprimer cette séance ?")){S.h.splice(+x.dataset.del,1);save();render()}}
 else if(e.target.id==="fin")finish();
 else if(e.target.id==="rst"){ask("Abandonner la séance en cours ? Les données saisies seront perdues.",()=>{S.d=null;OP=0;save();render()})}
 else if(e.target.id==="imp"){askInput('Colle ici les données copiées avec « Copier toutes les données » :',v=>importH(v))}
 else if(e.target.id==="exp"){const j=JSON.stringify(S.h,null,1),M="Copie impossible automatiquement. Sélectionne et copie le texte ci-dessous :";try{navigator.clipboard.writeText(j).then(()=>ask("Données copiées dans le presse-papiers."),()=>ask(M,null,j))}catch(er){ask(M,null,j)}}
});
$("#main").addEventListener("change",e=>{if(e.target.id==="ce"){CE=e.target.value;render()}});
$("#main").addEventListener("input",e=>{
 const i=e.target;if(!i.dataset.k)return;
 const d=getD(V),st=d.sets[i.dataset.k]||(d.sets[i.dataset.k]={});
 st[i.dataset.f]=i.value.replace(",",".");save();
});
$('#tabs').addEventListener('click',e=>{
 const b=e.target.closest('.tab');if(!b)return;const v=b.dataset.v;
 const go=()=>{V=v;OP=0;HS=false;SEL.clear();render();scrollTo(0,0)};
 if(v!=="H"&&v!==V&&S.d&&S.d.t!==v&&nDone(S.d)){ask("Une séance "+S.d.t+" est en cours. L’abandonner pour passer à la séance "+v+" ?",()=>{S.d=null;go()});return}
 go();
});
$('#mach').onclick=()=>{S.mach=S.mach===false;save();render()};
$('#chg').onclick=()=>{V='C';OP=0;HS=false;SEL.clear();render();scrollTo(0,0)};
function adj(n){const t=S.d&&S.d.tm;if(!t)return;t.dur=Math.max(0,t.dur+n);t.b=0;save();tick()}
$("#okb").onclick=()=>{const d=S.d,t=d&&d.tm;if(!t)return;const s=d.sets[t.k];if(s&&!t.fin)s.rest=String(Math.round((Date.now()-t.st)/1000));t.fin=true;t.hide=true;save();render()};
$("#m15").onclick=()=>adj(-15);$("#p15").onclick=()=>adj(15);
$("#hid").onclick=()=>{if(S.d&&S.d.tm){S.d.tm.hide=true;save();bar()}};
if(S.d&&nDone(S.d)){S.p=S.d.p||'min';V=S.d.t}else{S.d=null;V='C'}
PROG=PROGS[S.p||'min'];
render();
(async function sync(){
 try{
  if(!window.claude||!claude.use)return;
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db||!user)return;
  const id=await user.id();if(!id)return;
  const ref=db.collection('data/users/'+id).doc('state');
  const snap=await ref.get();
  if(snap.exists){
   const r=JSON.parse(JSON.stringify(snap.data()||{}));
   const seen=new Set(S.h.map(x=>x.date));
   (r.h||[]).forEach(x=>{if(!seen.has(x.date)){S.h.push(x);seen.add(x.date)}});
   S.h.sort((a,b)=>b.date-a.date);
   if(!S.d&&r.d)S.d=r.d;
   if(!S.p&&r.p)S.p=r.p;
   if(S.mach===undefined&&r.mach!==null&&r.mach!==undefined)S.mach=r.mach;
  }
  REF=ref;
  PROG=PROGS[S.p||'min'];
  if(V==='C'&&S.d&&nDone(S.d)){S.p=S.d.p||'min';PROG=PROGS[S.p];V=S.d.t}
  try{localStorage.setItem("z2h",JSON.stringify(S))}catch(e){}
  push();render();
 }catch(e){}
})();
</script>
</body>
</html>
